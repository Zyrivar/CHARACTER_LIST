<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тварикони — лист агента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@500;700&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --sunk:#E3E9E7; --line:#C6D1CF; --text:#13303A; --muted:#5A6F72;
  --water:#1C7C83; --water-soft:#CBE7E8; --sand:#9A6B12; --sand-soft:#F1E3C4; --blood:#B23A28; --blood-soft:#F4D6D0; --ok:#2E7D4F; --will:#5B4B8A; --will-soft:#E3DEF1;
  --display:"Jura","Trebuchet MS",system-ui,sans-serif; --body:"Golos Text","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E2229; --surface:#15313A; --sunk:#10282F; --line:#2B4B54; --text:#E7E2D4; --muted:#93A7A6;
    --water:#6CC7C9; --water-soft:#1D4A50; --sand:#D9B46A; --sand-soft:#473B22; --blood:#E06A55; --blood-soft:#4A2521; --ok:#7BCB93; --will:#B4A3E8; --will-soft:#2F2A4A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E2229; --surface:#15313A; --sunk:#10282F; --line:#2B4B54; --text:#E7E2D4; --muted:#93A7A6;
  --water:#6CC7C9; --water-soft:#1D4A50; --sand:#D9B46A; --sand-soft:#473B22; --blood:#E06A55; --blood-soft:#4A2521; --ok:#7BCB93; --will:#B4A3E8; --will-soft:#2F2A4A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 120px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 14px 0;max-width:760px;margin:0 auto}
.idrow{display:flex;gap:8px;align-items:center}
.idrow select{flex:1;min-width:0;font:700 20px/1.2 var(--display);background:transparent;border:0;padding:4px 0;letter-spacing:.01em}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync.warn{color:var(--blood)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:none;border:0;padding:10px 12px 9px;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--water)}

/* blocks */
section.blk{margin-top:18px}
h2{font:700 17px/1.2 var(--display);margin:0 0 10px;letter-spacing:.02em}
h3{font:600 14px/1.3 var(--body);margin:14px 0 6px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px;font-weight:600}
.btn.pri{background:var(--water);border-color:var(--water);color:var(--bg)}
.btn.danger{color:var(--blood);border-color:var(--blood)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.step button{width:38px;height:38px;border:0;background:transparent;font-size:18px;font-weight:600}
.step button:disabled{opacity:.3}
.step span{min-width:34px;text-align:center;font:700 17px var(--display)}
input.f,select.f,textarea.f{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea.f{min-height:70px;resize:vertical}
input.f.num{width:74px;text-align:center}
label.fl{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}

/* the track */
.track{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0 10px}
.cell{width:22px;height:30px;border-radius:5px;border:1.5px solid var(--water);background:var(--water)}
.cell.lost{background:transparent;opacity:.45}
.cell.ob{border-color:var(--sand);background:var(--sand)}
.cell.ob.lost{background:transparent}
.gap{width:10px}
.cell.nk{width:16px;height:24px;border-color:var(--will);background:var(--will)}
.cell.nk.lost{background:transparent}
.fallen{background:var(--will-soft);color:var(--will);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.fallen b{display:block;font-size:15px;margin-bottom:2px}
.wpip{border:2px solid var(--blood);border-radius:50%;background:transparent;display:inline-grid;place-items:center;color:var(--blood);font:700 12px var(--display);padding:0}
.wpip.on{background:var(--blood);color:var(--bg)}
.w1{width:30px;height:30px}.w2{width:36px;height:36px}.w3{width:44px;height:44px}
.trackhead{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.big{font:700 30px/1 var(--display)}
.lbl{font-size:12px;color:var(--muted)}
.dead{background:var(--blood-soft);color:var(--blood);border-radius:10px;padding:10px 12px;font-weight:600;margin-bottom:10px}
.pen{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--blood-soft);color:var(--blood);font-size:13px;font-weight:600}
.pen.sand{background:var(--sand-soft);color:var(--sand)}

/* balance */
.bal{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.balnum{font:700 52px/1 var(--display);color:var(--sand);min-width:64px;text-align:center}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:6px 0}
.meter i{height:10px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.meter i.on{background:var(--sand);border-color:var(--sand)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font:700 24px/1.1 var(--display)}
.stat small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--water);color:var(--bg);font-weight:600}
.tok{width:24px;height:24px;border-radius:50%;border:2px solid var(--water);display:inline-block}
.tok.on{background:var(--water)}

/* skills */
.budget{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--water)}
.bar.over i{background:var(--blood)}
.sk{display:grid;grid-template-columns:34px 1fr auto;column-gap:10px;row-gap:2px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sk .skh{grid-column:2/-1}
.sk .ctl{display:flex;gap:8px;align-items:center}
.step.cmp button{width:30px;height:34px;font-size:16px}.step.cmp span{min-width:26px;font-size:16px}
.sk:first-of-type{border-top:0}
.star{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:16px;color:var(--muted);padding:0}
.star.on{border-color:var(--sand);background:var(--sand);color:var(--bg)}
.skn{font-weight:600}
.skh{font-size:12.5px;color:var(--muted);line-height:1.3}
.skv{font:700 24px/1 var(--display);min-width:34px;text-align:right}
.skv sup{font-size:12px;color:var(--water);margin-left:2px}
.skv sup.neg{color:var(--blood)}
.dice{width:40px;height:40px;border-radius:10px;border:1px solid var(--water);background:transparent;color:var(--water);font:700 13px var(--display);padding:0}

/* items */
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0;padding-top:0}
.item .nm{font-weight:600;flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.ammo{display:inline-flex;gap:3px;vertical-align:middle}
.ammo i{width:8px;height:16px;border-radius:2px;background:var(--sand)}
.ammo i.off{background:transparent;border:1px solid var(--line)}
.sw{position:relative;width:46px;height:28px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);padding:0;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-pressed="true"]{background:var(--water);border-color:var(--water)}
.sw[aria-pressed="true"]::after{left:21px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.grid2 label{font-size:12px;color:var(--muted)}
.grid2 input{width:100%}
.loadbar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;position:relative}
.loadbar i{display:block;height:100%;background:var(--water)}
.loadbar.o1 i{background:var(--sand)} .loadbar.o2 i{background:var(--blood)}

/* beliefs */
.bel{border-top:1px solid var(--line);padding:12px 0}
.bel:first-child{border-top:0;padding-top:0}
.bel.gone .f{text-decoration:line-through;opacity:.6}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}

/* log */
.log{font-size:13px;max-height:220px;overflow:auto}
.log div{padding:5px 0;border-top:1px solid var(--line)}
.log div:first-child{border-top:0}
.log time{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}

/* roller sheet */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:62px;height:62px;border-radius:50%;border:0;background:var(--water);color:var(--bg);font:700 15px var(--display);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.scrim{position:fixed;inset:0;background:rgba(5,15,18,.55);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s ease;max-width:760px;margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.sw::after{transition:none}}
.res{margin-top:14px;border-radius:14px;padding:14px;background:var(--sunk);border:1px solid var(--line)}
.res .tot{font:700 48px/1 var(--display)}
.res.win{border-color:var(--ok)} .res.win .verdict{color:var(--ok)}
.res.fail{border-color:var(--blood)} .res.fail .verdict{color:var(--blood)}
.verdict{font-weight:700;font-size:17px}
.parts{font-size:13px;color:var(--muted);margin-top:6px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}.cell{width:18px;height:26px}}
.cell.sq{width:14px;height:22px}
.cell.thr{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--blood)}
.gonecard{opacity:.62}
.facgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ftab{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.ftab td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:top}
.ctl{font-size:13px;margin:8px 0 10px;padding:8px 10px;border-radius:10px;background:var(--sunk);color:var(--muted)}
.ctl.on{background:var(--water-soft);color:var(--text);font-weight:600}
details summary{cursor:pointer;color:var(--muted)}
.wrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 12px}
.wrow .wl{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="idrow">
    <select id="charSel" aria-label="Выбор агента"></select>
    <span id="sync" class="sync">Загрузка…</span>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main class="wrap" id="main"></main>
<button class="fab" data-act="roll-open" aria-label="Проверка навыка">d20</button>
<div class="scrim" id="scrim" data-act="r-close"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Проверка"></div>

<script>
"use strict";
/* ---------- rules data ---------- */
const SKILLS=[
 {k:'agi',n:'Ловкость',g:'Тело и бой',h:'Уклонение, акробатика, бесшумность, ближний бой. Определяет инициативу.'},
 {k:'con',n:'Телосложение',g:'Тело и бой',h:'Сила и выносливость, ближний бой. +2 ОЗ и +2 к грузу за очко.'},
 {k:'att',n:'Внимательность',g:'Тело и бой',h:'Заметить скрытое, среагировать. +1 к пассивной защите за очко.'},
 {k:'sho',n:'Стрельба',g:'Тело и бой',h:'Дальний бой, метание, баллистика.'},
 {k:'prs',n:'Убеждение',g:'Люди',h:'Красноречие, аргументы, торг.'},
 {k:'prv',n:'Провокация',g:'Люди',h:'Задеть, подорвать авторитет, угрожать.'},
 {k:'wil',n:'Воля',g:'Люди',h:'Сопротивление давлению и ужасу. Очки воли: Непоколебимость = (Равновесие + Воля) × 2.'},
 {k:'emp',n:'Эмпатия',g:'Люди',h:'Понять чувства и мотивы, распознать ложь.'},
 {k:'tec',n:'Технологии',g:'Знания',h:'Создать, починить, разобрать механизм.'},
 {k:'hak',n:'Хакерство',g:'Знания',h:'Проникнуть в сеть, добыть данные, послать сигнал.'},
 {k:'bio',n:'Биохимия',g:'Знания',h:'Лечение ран, медтехника, синтез веществ.'},
 {k:'cul',n:'Культурология',g:'Знания',h:'Ритуалы, язык и знаки Тарикона, вести себя «своим».'}
];
const SK=Object.fromEntries(SKILLS.map(s=>[s.k,s]));
const BUDGET=30, SKILL_CAP=6;
const WOUNDS=[{n:'Слабое',pen:-1,dc:10},{n:'Серьёзное',pen:-2,dc:15},{n:'Смертельное',pen:-4,dc:20}];
const TABS=[['agent','Агент'],['skills','Навыки'],['beliefs','Убеждения'],['gear','Снаряжение'],['army','Войска'],['dossier','Досье']];
const SECRETS=['Какие кошмары мне снятся по ночам?','Остались ли у меня хоть какие-то пристрастия?','Каким я вижу своё будущее?','Какие люди мне нравятся?','Какие события сильнее всего ударили по мне?','Что я скрываю и что рискую показать, когда равновесие достигнет 0?'];

/* ---------- helpers ---------- */
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sgn=n=>n>0?'+'+n:String(n);
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%n)}
const clone=o=>JSON.parse(JSON.stringify(o));

function newItem(p){return Object.assign({id:uid(),name:'Новый предмет',notes:'',weight:1,equipped:true,ob:0,pz:0,su:0,oz:0,dmg:0,ammoMax:0,ammo:0,range:'',autoFire:false},p||{})}
function newChar(){
 return {
  id:uid(),name:'Новый агент',player:'',concept:'',creation:true,
  skills:Object.fromEntries(SKILLS.map(s=>[s.k,0])),pro:[],bonuses:[],
  hpLost:0,armorLost:0,wounds:[false,false,false],dead:false,mortalMin:null,
  balance:10,tokens:2,position:'stand',water:0,
  resolve:{on:false,max:0,lost:0,over:0},
  items:[
   newItem({name:'Пистолет скрытого ношения',notes:'9×19 мм. Не обнаруживается металлоискателем, выстрел не громче хлопка в ладоши.',dmg:3,ammoMax:4,ammo:4,range:'Средняя'}),
   newItem({name:'Бронеткань скрытого ношения',ob:4,pz:1})
  ],
  abilities:[],
  beliefs:{personal:[{text:'',ability:''},{text:'',ability:''},{text:'',ability:''}],professional:[{text:'',reward:'',renounced:false},{text:'',reward:'',renounced:false},{text:'',reward:'',renounced:false}],acquired:[],imposed:[]},
  device:{on:false,name:'',powerMax:0,powerUsed:0,anonMax:0,anonUsed:0,djinns:[]},
  rep:[],fame:1,hope:50,army:newArmy(),
  dossier:{self:'',backstory:'',secrets:SECRETS.map(()=>'')},
  log:[],updated:Date.now()
 };
}
function normalize(c){ // fill fields missing in older saves
 const d=newChar(); for(const k in d){ if(c[k]===undefined) c[k]=d[k]; }
 for(const s of SKILLS) if(typeof c.skills[s.k]!=='number') c.skills[s.k]=0;
 c.beliefs=Object.assign(d.beliefs,c.beliefs||{});
 c.device=Object.assign(d.device,c.device||{});
 c.dossier=Object.assign(d.dossier,c.dossier||{});
 c.resolve=Object.assign(d.resolve,c.resolve||{});
 c.army=Object.assign(d.army,c.army||{});
 c.army.faction=Object.assign(newArmy().faction,c.army.faction);
 c.army.battle=Object.assign(newArmy().battle,c.army.battle);
 return c;
}

/* ---------- derived stats ---------- */
function skillTotal(c,k){return (c.skills[k]||0)+c.bonuses.filter(b=>b.skill===k).reduce((a,b)=>a+b.delta,0)}
function D(c){
 const eq=c.items.filter(i=>i.equipped), sum=f=>eq.reduce((a,i)=>a+(+i[f]||0),0);
 const con=skillTotal(c,'con'), att=skillTotal(c,'att');
 const hpMax=6+2*con+sum('oz'), obMax=sum('ob');
 const hp=clamp(hpMax-c.hpLost,0,hpMax), ob=clamp(obMax-c.armorLost,0,obMax);
 const load=sum('weight'), cap=8+2*con;
 const over=load>2*cap?2:load>cap?1:0, overPen=[0,-2,-4][over];
 const wi=c.wounds.lastIndexOf(true), woundPen=wi<0?0:WOUNDS[wi].pen;
 const pos=c.position, posMove=pos==='sit'?1:pos==='lie'?2:0;
 const pzBase=8+att+sum('pz')+overPen;
 const pzMelee=pzBase+(pos==='sit'?-4:pos==='lie'?-8:0);
 const pzRanged=pzBase+(pos==='lie'?2:0);
 return {hpMax,obMax,hp,ob,load,cap,over,overPen,woundPen,su:sum('su'),
  pz:pzBase,pzMelee,pzRanged,speed:Math.max(0,6-over-posMove),init:skillTotal(c,'agi'),
  resolveStart:Math.max(0,(c.balance+skillTotal(c,'wil'))*2),
  resolve:Math.max(0,c.resolve.max-c.resolve.lost),used:SKILLS.reduce((a,s)=>a+(c.skills[s.k]||0),0)};
}
const balText=b=>b>=9?'Поступает рационально':b>=6?'Лёгкое напряжение':b>=3?'Подвержен эмоциям':b>=1?'На грани срыва':'Показывает настоящее лицо';
const repText=v=>v>=10?'Полное доверие':v>=6?'Союзники':v>=3?'Партнёры':v>-3?'Безразличие':v>-6?'Противники':v>-10?'Вражда':'Абсолютная вражда';
const fameText=v=>v>=10?'Главная фигура города':v>=8?'Город следит за каждым шагом':v>=5?'Вы на слуху':v>=3?'Некоторые следят за вами':v>=1?'Почти незаметны':'О вас не вспоминают';

/* ---------- state & storage ---------- */
let chars={}, cur=null, tab='agent', ui={dmg:1,rdmg:1,edit:null,av:'squads',sqEdit:null,sqDmg:{},atk:null,atkDef:0,atkMelee:true,raze:null,F:null}, dirty=false;
let db=null, col=null, mode='local', writing=false, pending=false, saveTimer=null, readOnly=false;
const LS='tvarikoni.v1';
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(o&&o.chars){chars=o.chars;for(const id in chars) normalize(chars[id]);cur=o.cur}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({chars,cur}))}catch(e){}}
function C(){return chars[cur]}
function setSync(t,warn){const s=document.getElementById('sync');s.textContent=t;s.classList.toggle('warn',!!warn)}

function ensureChar(){
 const ids=Object.keys(chars);
 if(!ids.length){const c=newChar();c._auto=true;chars[c.id]=c;cur=c.id;return c}
 if(!chars[cur]) cur=ids.sort((a,b)=>(chars[b].updated||0)-(chars[a].updated||0))[0];
 return chars[cur];
}
function save(){
 const c=C(); if(!c) return; delete c._auto; c.updated=Date.now(); dirty=true; lsSave();
 if(mode!=='db'||readOnly){ if(mode!=='db') setSync('Сохранено на устройстве'); dirty=false; return; }
 setSync('Сохраняю…'); clearTimeout(saveTimer); saveTimer=setTimeout(flush,600);
}
async function flush(){
 if(writing){pending=true;return}
 const c=C(); if(!c) return; writing=true; pending=false;
 try{ await col.doc(c.id).set(clone(c)); setSync('Синхронизировано'); }
 catch(e){
  if(e&&e.code==='unavailable'){ setTimeout(flush,800+Math.random()*800); }
  else if(e&&e.code==='invalid_argument'){ readOnly=true; setSync('Только просмотр',true); }
  else if(e&&e.code==='quota_exceeded'){ setSync('Хранилище заполнено',true); }
  else setSync('Не сохранилось',true);
 }
 writing=false; if(pending){flush();return} dirty=false;
}
async function remove(id){
 delete chars[id]; if(cur===id) cur=null; ensureChar(); lsSave();
 if(mode==='db'){ try{await col.doc(id).delete()}catch(e){} save(); } render();
}
function initDb(){
 if(!window.claude||!window.claude.use){ mode='local'; setSync('Сохранено на устройстве'); return; }
 window.claude.use('db').then(d=>{
  if(!d){ mode='local'; setSync('Сохранено на устройстве'); return; }
  db=d; col=db.collection('characters'); let first=true;
  col.onSnapshot(snap=>{
   if(snap.metadata.fromCache && first && snap.empty) return;
   const remote={}; snap.docs.forEach(doc=>{ if(doc.exists) remote[doc.id]=normalize(clone(doc.data())) });
   if(first){
    first=false; mode='db';
    // carry over local-only sheets (made before sync came up)
    for(const id in chars) if(!remote[id]&&!chars[id]._auto) { remote[id]=chars[id]; col.doc(id).set(clone(chars[id])).catch(()=>{}); }
    chars=remote; ensureChar(); lsSave(); setSync('Синхронизировано'); render(); return;
   }
   let changed=false;
   for(const id in remote){ if(id===cur&&(dirty||writing)) continue; if(JSON.stringify(remote[id])!==JSON.stringify(chars[id])){chars[id]=remote[id];changed=true} }
   for(const id in chars){ if(!remote[id]&&id!==cur){delete chars[id];changed=true} }
   if(changed){ ensureChar(); lsSave(); if(!isTyping()) render(); }
  },err=>{ mode='local'; setSync('Синхронизация недоступна',true); });
 });
}
const isTyping=()=>{const a=document.activeElement;return a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type==='text'))};

/* ---------- log ---------- */
function log(s){const c=C();const t=new Date();c.log.unshift({t:t.toTimeString().slice(0,5),s});c.log=c.log.slice(0,40)}

 document.getElementById('tabs').innerHTML=TABS.map(([k,n])=>`<button role="tab" aria-selected="${tab===k}" data-act="tab" data-v="${k}">${n}</button>`).join('');

 document.getElementById('main').innerHTML=({agent:vAgent,skills:vSkills,beliefs:vBeliefs,gear:vGear,army:vArmy,dossier:vDossier}[tab])(c,d);
 if(R.open) renderSheet();
}

}

function resolveHit(c,n){
 const r=c.resolve, left=Math.max(0,r.max-r.lost), a=Math.min(n,left), rest=n-a;
 r.lost+=a; r.over+=rest;
 const msg=[`Выпад ${n}`]; if(a) msg.push(`−${a} непоколебимости`);
 if(a&&a===left) msg.push('эмоции взяли верх');
 if(rest) msg.push(`${rest} по равновесию — решает игрок`);
 log(msg.join(', '));
}

const SQ_TACTICS=[['','Без тактики',''],['rush','Ускорение','+2 зоны передвижения, атаковать нельзя.'],['boost','Усиление','+2 к урону в ближнем бою, но +1 к получаемому урону.'],['rest','Перевести дух','Отряд не действует. Если его не атаковали — +2 здоровья. Раз за сражение.'],['def','Оборона','+1 к Защите, −1 к Силе.']];
const SQ_STATS=[['power','Сила'],['def','Защита'],['range','Дальность'],['move','Передвижение'],['init','Инициатива']];
const TR_ACTIONS=[['attack','Атака','Сражение за соседний узел силы.'],['defend','Оборона','+4 к потенциалу защиты до конца дня.'],['fort','Укрепление позиции','+2 к защите всех союзных войск в узле. Одно на узел.'],['heal','Восполнение сил','+3 здоровья.'],['raid','Партизанский удар','Урон противнику без полноценного боя.'],['raze','Разрушение укреплений','Снять укрепление в соседнем узле.'],['loot','Мародёрство','−1 благополучия района, без обеспечения.']];
const TR_SPECIAL=[['','Без особого манёвра'],['last','Бой до последней капли крови'],['suicide','Суицидальная атака'],['aggr','Агрессивная атака']];
const ACT_NAME=Object.fromEntries([...TR_ACTIONS.map(a=>[a[0],a[1]]),['aggr','Агрессивная атака']]);
function newArmy(){return {squads:[],battle:{on:false,round:1,side:'attack',enemy:0},
 faction:{atk:0,def:0,dmg:3,hp:10,disc:5,discWin:1,discLoss:1,costLast:1,costSuicide:1,costAggr:1},armies:[],districts:[],day:1}}
function newSquad(){return {id:uid(),name:'Новый отряд',base:'',notes:'',range:1,power:3,init:0,hpMax:10,hp:10,move:1,speed:0,def:1,
 tactic:'',acted:false,attacked:false,restUsed:false,lost:false,high:false,rough:false,fort:false,mods:[],tactics:[],mergeWith:''}}
function newTroop(A){return {id:uid(),name:`Войско ${A.armies.length+1}`,node:'',hp:+A.faction.hp,disc:+A.faction.disc,action:'',last:false,status:'',razeTo:'',retreatTo:''}}
function newNode(){return {id:uid(),name:'Узел силы',ours:false,fort:false}}
function newDistrict(){return {id:uid(),name:'Новый район',ready:1,welfare:5,nodes:[newNode(),newNode()]}}
function nodeOf(A,id){for(const d of A.districts){const n=d.nodes.find(x=>x.id===id);if(n) return {n,d}}return null}
function nodeOpts(A,sel,pred,none){return `<option value="">${none||'— узел силы —'}</option>`+A.districts.map(d=>`<optgroup label="${esc(d.name)}">${d.nodes.filter(n=>!pred||pred(n)).map(n=>`<option value="${n.id}" ${sel===n.id?'selected':''}>${esc(n.name)}${n.ours?' · наш':''}${n.fort?' · укреплён':''}</option>`).join('')}</optgroup>`).join('')}
const welfText=w=>w<=2?'сложность политического захвата −4':w<=4?'сложность политического захвата −2':w<=6?'без дополнительных эффектов':w<=8?'сложность политического захвата +2':'сложность политического захвата +4';

function SQ(s){ // squad derived stats
 const m=k=>s.mods.filter(x=>x.stat===k).reduce((a,x)=>a+(+x.delta||0),0);
 const t=s.tactic, ct=t&&t[0]==='c'?s.tactics[+t.slice(1)]:null, tv=k=>ct?(+ct[k]||0):0;
 const half=Math.floor(s.hpMax/2), gone=s.hp<=0;
 const losses=gone?0:(s.hp<half?1:0)+(s.hp<=2?1:0);
 const lf=v=>v<=1?v:Math.max(1,v-losses);
 const rangeRaw=+s.range+m('range')+tv('range'), ranged=+s.range>1;
 return {half,gone,losses,ranged,
  power:lf(+s.power+m('power')+tv('power')-(t==='def'?1:0)),
  def:lf(+s.def+m('def')+tv('def')+(t==='def'?1:0)+(s.fort?1:0)),
  range:rangeRaw+(s.high&&ranged?1:0),
  move:Math.max(0,Math.max(+s.move,+s.move+(+s.speed||0))+m('move')+tv('move')+(t==='rush'?2:0)-(s.rough?1:0)),
  init:+s.init+m('init'),
  melee:t==='boost'?2:0, extra:t==='boost'?1:0,
  canAttack:!gone&&t!=='rush'&&t!=='rest'};
}
function TR(A,t){ // army derived stats
 const f=A.faction, nd=nodeOf(A,t.node), dis=t.disc<=0;
 const ready=nd?Math.max(0,(+nd.d.ready||1)-1):0, fort=nd&&nd.n.ours&&nd.n.fort?2:0;
 const gone=t.status==='captured'||t.status==='destroyed';
 return {atk:+f.atk+ready+(dis?-4:0),def:+f.def+(t.action==='defend'?4:0)+fort+(dis?-4:0),dmg:+f.dmg,hpMax:+f.hp,dis,ready,fort,nd,gone,
  down:t.hp<=0&&!t.last,free:!gone&&!dis&&!t.action&&t.status!=='retreat'&&(t.hp>0||t.last)};
}

function sqCard(A,s){
 const q=SQ(s), B=A.battle, ed=ui.sqEdit===s.id, dmgN=ui.sqDmg[s.id]||1;
 const tinfo=s.tactic&&s.tactic[0]==='c'?(s.tactics[+s.tactic.slice(1)]||{}).text:(SQ_TACTICS.find(t=>t[0]===s.tactic)||['','',''])[2];

 const mates=A.squads.filter(x=>x.id!==s.id&&x.hp>0&&SQ(x).losses);
 let cells=''; for(let i=0;i<s.hpMax;i++) cells+=`<i class="cell sq ${i<s.hp?'':'lost'} ${i+1===q.half?'thr':''}"></i>`;
 return `
 <section class="blk card ${q.gone?'gonecard':''}">

   ${B.on?`<button class="btn sm" data-act="sq-acted" data-id="${s.id}">${s.acted?'Снять отметку':'Подействовал'}</button>`:''}
  </div>

function fight(c){
 const A=c.army, F=ui.F, f=A.faction, atk=F.role==='attack';
 const ours=A.armies.filter(t=>F.ours[t.id]);
 if(!ours.length){toast('Отметьте свои войска');return false}
 if(!F.target){toast('Выберите узел силы');return false}
 const cost=F.special?+f[{last:'costLast',suicide:'costSuicide',aggr:'costAggr'}[F.special]]||0:0;
 if(ours.some(t=>t.disc<cost)){toast('Не хватает дисциплины для манёвра');return false}
 const aggr=F.special==='aggr', tgt=nodeOf(A,F.target);
 const O=ours.map(t=>{if(cost) t.disc-=cost; if(F.special==='last') t.last=true;
  const q=TR(A,t),d=rnd(20),pot=atk?q.atk:q.def;return {t,q,d,pot,tot:d+pot,dmg:q.dmg+(aggr?2:0),taken:0,dealt:0,sui:null}});
 const E=F.enemies.map(e=>{const d=rnd(20),pot=+e.pot||0;return {e,d,pot,tot:d+pot,dmg:+e.dmg||0,taken:0,zero:false}});
 for(const o of O) for(const e of E){
  if(o.tot>e.tot){ if(F.special==='suicide'&&!o.sui){o.sui=e;e.zero=true} else if(F.special!=='suicide'){e.taken+=o.dmg;o.dealt+=o.dmg} }
  else if(e.tot>o.tot) o.taken+=e.dmg+(aggr?1:0);
 }
 const best=a=>Math.max(...a.map(x=>x.tot)), win=best(O)>best(E), lose=best(O)<best(E), notes=[];
 for(const o of O){ const t=o.t;
  if(atk&&!t.action) t.action=aggr?'aggr':'attack';
  t.hp-=o.taken; if(!t.last) t.hp=Math.max(0,t.hp);
  if(o.sui){t.status='destroyed';notes.push(`${t.name}: суицидальная атака — ${o.sui.e.name} теряет всё здоровье, войско уничтожено.`);continue}
  if(t.hp<=0){ if(t.last){ if(t.hp<=-o.q.hpMax){t.status='destroyed';notes.push(`${t.name} сражалось до конца и уничтожено.`)} else notes.push(`${t.name} не отступает: здоровье ${t.hp}.`) }
   else {t.status='retreat';notes.push(`${t.name}: здоровье 0 — отступление на союзный узел или плен.`)} }
  if(t.status!=='destroyed'){ if(win) t.disc+=+f.discWin||0; if(lose) t.disc=Math.max(0,t.disc-(+f.discLoss||0)); }
 }
 if(win&&atk&&tgt){ tgt.n.ours=true; for(const o of O) if(o.t.status==='') o.t.node=F.target; notes.push(`Узел «${tgt.n.name}» захвачен.`) }
 const holds=O.some(o=>o.t.last&&o.t.status!=='destroyed');
 if(lose&&!atk&&tgt&&holds) notes.push(`«${tgt.n.name}» удерживается: войско сражается до последней капли крови.`);
 if(lose&&!atk&&tgt&&!holds){ tgt.n.ours=false; for(const o of O) if(o.t.status===''&&o.t.node===F.target) o.t.status='retreat'; notes.push(`Узел «${tgt.n.name}» потерян — войска в нём отступают.`) }
 if(win&&f.discWin) notes.push(`Победа: +${f.discWin} дисциплины.`); if(lose&&f.discLoss) notes.push(`Поражение: −${f.discLoss} дисциплины.`);
 F.res={win,lose,title:win?'Победа':lose?'Поражение':'Ничья — урон не нанесён',notes,rows:[
  ...O.map(o=>({n:o.t.name,d:o.d,pot:o.pot,tot:o.tot,note:[o.dealt?`нанесло ${o.dealt}`:'',o.taken?`получило ${o.taken}`:''].filter(Boolean).join(', ')||'—'})),
  ...E.map(e=>({n:e.e.name,d:e.d,pot:e.pot,tot:e.tot,note:e.zero?'здоровье до 0':e.taken?`получило ${e.taken}`:'—'}))]};
 log(`Сражение за «${tgt?tgt.n.name:'узел'}»: ${F.res.title.toLowerCase()} (${best(O)} против ${best(E)})`);
 return true;
}

function armyAct(a,ds,c,n,i){
 const A=c.army, s=ds.id?A.squads.find(x=>x.id===ds.id):null, t=ds.id?A.armies.find(x=>x.id===ds.id):null, dist=ds.id?A.districts.find(x=>x.id===ds.id):null;

  case 'sq-hit': { const q=SQ(s), N=ui.sqDmg[s.id]||1; let r=Math.max(0,N-q.def); if(q.extra&&r>0) r+=q.extra;
   s.hp=Math.max(0,s.hp-r); s.attacked=true; const q2=SQ(s);
   log(`${s.name}: урон ${N} − Защита ${q.def}${q.extra&&r>0?' + 1 (Усиление)':''} → −${r}`+(q2.losses>q.losses?', несёт потери':'')+(q2.gone?', покидает поле боя':'')); break; }
  case 'sq-heal': { const q=SQ(s); s.hp=Math.min(s.hpMax,s.hp+1); if(SQ(s).losses<q.losses) log(`${s.name} восстановил потери`); break; }

  case 'f-open': ui.F={role:ds.v||'attack',ours:{},special:'',target:'',enemies:[{name:'Войско противника',pot:0,dmg:3}],res:null}; window.scrollTo(0,0); return 'ui';
  case 'f-close': ui.F=null; return 'ui';
  case 'f-role': ui.F.role=ds.v; ui.F.ours={}; ui.F.special=''; ui.F.target=''; return 'ui';
  case 'f-our': ui.F.ours[ds.id]=!ui.F.ours[ds.id]; return 'ui';

  default: return 'none';
 }
}

const R={open:false,skill:'sho',mod:0,dc:'',attack:false,atype:'normal',aim:2,light:0,cover:0,weapon:'',power:0,res:null};
function openRoll(k,weaponId){
 Object.assign(R,{open:true,res:null,mod:0,power:0});
 if(k) R.skill=k;
 if(weaponId){const w=C().items.find(i=>i.id===weaponId);R.attack=true;R.weapon=weaponId;R.skill=+w.ammoMax||w.range?'sho':'agi';R.atype='normal'}

function rollParts(c,d){
 const ranged=R.skill==='sho', p=[[SK[R.skill].n,skillTotal(c,R.skill)]];
 if(d.woundPen) p.push(['Ранение',d.woundPen]);
 if(R.attack){
  if(d.overPen) p.push(['Перегруз',d.overPen]);
  const at={heavy:['Тяжёлая атака',4],auto:['Автоматическая',-2],aimed:['Прицельная',-R.aim],back:['Атака в спину',4],blank:['Стрельба в упор',-4]}[R.atype];
  if(at&&!(R.atype==='blank'&&!ranged)) p.push(at);
  if(R.light) p.push(['Освещение',R.light]);
  if(R.cover) p.push(['Укрытие цели',R.cover]);
  const pos=c.position; if(pos!=='stand') p.push(['Своё положение',ranged?(pos==='sit'?1:2):(pos==='sit'?-4:-8)]);
 }
 if(R.skill==='hak'&&c.device.on&&R.power) p.push(['Мощность',3*R.power]);
 if(+R.mod) p.push(['Модификатор',+R.mod]);
 return p;
}

 document.getElementById('sheet').innerHTML=`

function doRoll(){
 const c=C(),d=D(c),w=c.items.find(i=>i.id===R.weapon);
 if(R.attack&&w&&+w.ammoMax){const need=R.atype==='auto'?2:1;if(w.ammo<need){R.res=null;renderSheet();toast('Нет патронов — перезарядитесь');return}w.ammo-=need}
 if(R.power){c.device.powerUsed+=R.power}
 const parts=rollParts(c,d), rolls=R.attack&&R.atype==='auto'?2:1, out=[];
 for(let n=0;n<rolls;n++){const dd=rnd(20);out.push({d:dd,total:dd+parts.reduce((a,x)=>a+x[1],0)})}
 const dc=+R.dc||0, r=out[0];
 R.res={d:out.map(o=>o.d).join(' и '),total:out.map(o=>o.total).join(' / '),raw:out,parts:clone(parts),dc,win:dc?r.total>=dc:null,auto:false,
  dmg:R.attack&&w?(+w.dmg+(R.atype==='heavy'?1:0)):0};
 log(`${SK[R.skill].n}: ${R.res.total}${dc?` против СЛ ${dc} — ${R.res.win?'успех':'провал'}`:''}${R.attack&&w?` (${w.name})`:''}`);
 R.power=0; save(); renderSheet(); if(tab==='agent'||tab==='gear') render();
}
function toast(t){setSync(t,true);setTimeout(()=>setSync(mode==='db'?'Синхронизировано':'Сохранено на устройстве'),2500)}

/* ---------- actions ---------- */
function damage(n){
 const c=C(),d=D(c); if(c.dead) return;
 let rem=Math.max(0,n-d.su), msg=[`Урон ${n}${d.su?` (−${d.su} СУ)`:''}`];
 const a=Math.min(rem,d.hp); c.hpLost+=a; rem-=a;
 const b=Math.min(rem,d.ob); c.armorLost+=b; rem-=b;
 if(a) msg.push(`−${a} ОЗ`); if(b) msg.push(`−${b} ОБ`);
 if(rem>0){
  if(c.wounds[2]){c.dead=true;msg.push('агент погиб')}
  else{const i=c.wounds.indexOf(false);c.wounds[i]=true;c.balance=Math.max(0,c.balance-2);msg.push(`${WOUNDS[i].n.toLowerCase()} ранение, −2 равновесия`);
   if(i===2){const x=rnd(6),y=rnd(6);c.mortalMin=40+10*(x+y);msg.push(`умрёт через ${c.mortalMin} мин`)}}
 }
 log(msg.join(', '));
}
function setPath(obj,path,val){
 const ks=path.split('.'); let o=obj;
 for(let i=0;i<ks.length-1;i++){let k=ks[i]; if(k[0]==='#'){o=o.find(x=>x.id===k.slice(1))}else o=o[k]; if(!o) return}
 o[ks[ks.length-1]]=val;
}
function act(a,ds,el){
 const c=C(); if(!c) return;
 if(el.hasAttribute('data-confirm')&&!el.dataset.armed){
  el.dataset.armed='1'; const t=el.textContent; el.textContent='Точно?';
  setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=t}},3000); return;
 }
 const d=D(c), n=+ds.d||0, i=+ds.i;
 const item=ds.id?c.items.find(x=>x.id===ds.id):null;
 let rer=true, sv=true;
 switch(a){
  case 'tab': tab=ds.v; sv=false; window.scrollTo(0,0); break;
  case 'dmg': ui.dmg=clamp(ui.dmg+n,1,50); sv=false; break;
  case 'take-dmg': damage(ui.dmg); break;
  case 'heal1': c.hpLost=Math.max(0,Math.min(c.hpLost,d.hpMax)-1); log('+1 ОЗ'); break;
  case 'rest': c.hpLost=0; log('Отдых 10 минут: ОЗ восстановлены'); break;
  case 'repair': c.armorLost=0; log('Броня восстановлена'); break;
  case 'wound': c.wounds[i]=!c.wounds[i]; if(!c.wounds[2]) c.mortalMin=null; else if(i===2&&c.mortalMin==null){c.mortalMin=40+10*(rnd(6)+rnd(6))} log(`${WOUNDS[i].n} ранение ${c.wounds[i]?'отмечено':'вылечено'}`); break;
  case 'revive': c.dead=false; log('Смерть отменена'); break;
  case 'bal': c.balance=clamp(c.balance+n,0,10); log(`Равновесие: ${c.balance}`); break;
  case 'res-start': c.resolve={on:true,max:d.resolveStart,lost:0,over:0}; log(`Социальное столкновение: непоколебимость ${d.resolveStart}`); break;
  case 'res-end': c.resolve={on:false,max:0,lost:0,over:0}; log('Столкновение завершено'); break;
  case 'rdmg': ui.rdmg=clamp(ui.rdmg+n,1,60); sv=false; break;
  case 'res-take': resolveHit(c,ui.rdmg); break;
  case 'tok-use': c.tokens=Math.max(0,c.tokens-1); log('Потрачен жетон профессионализма'); break;
  case 'new-day': c.tokens=2; log('Новый день: 2 жетона'); break;
  case 'pos': c.position=ds.v; break;
  case 'log-clear': c.log=[]; break;
  case 'creation': c.creation=!c.creation; break;
  case 'skill': c.skills[ds.k]=clamp(c.skills[ds.k]+n,0,SKILL_CAP); break;
  case 'pro': { const k=ds.k; if(c.pro.includes(k)) c.pro=c.pro.filter(x=>x!==k); else { if(c.pro.length>=2) c.pro.shift(); c.pro.push(k);} break; }
  case 'renounce': { const p=c.beliefs.professional[i]; p.renounced=true; c.bonuses.push({skill:p.reward,delta:2,src:`Отказ от «${p.text||'проф. убеждения'}»`}); log(`Отказ от профессионального убеждения: +2 ${SK[p.reward].n}`); break; }
  case 'imp-add': c.beliefs.imposed.push({text:'',skill:'',renounced:false}); break;
  case 'imp-renounce': { const p=c.beliefs.imposed[i]; p.renounced=true; c.bonuses.push({skill:p.skill,delta:-2,src:`Отказ от навязанного «${p.text||'убеждения'}»`}); log(`Отказ от навязанного убеждения: −2 ${SK[p.skill].n}`); break; }
  case 'imp-del': c.beliefs.imposed.splice(i,1); break;
  case 'bonus-del': c.bonuses.splice(i,1); break;
  case 'item-add': { const it=newItem(); c.items.push(it); ui.edit=it.id; break; }
  case 'item-del': c.items=c.items.filter(x=>x.id!==ds.id); ui.edit=null; break;
  case 'item-eq': item.equipped=!item.equipped; break;
  case 'item-auto': item.autoFire=!item.autoFire; break;
  case 'item-edit': ui.edit=ui.edit===ds.id?null:ds.id; sv=false; break;
  case 'reload': item.ammo=+item.ammoMax; log(`Перезарядка: ${item.name}`); break;
  case 'attack': openRoll(null,ds.id); sv=false; rer=false; break;
  case 'ab-add': c.abilities.push({name:'',text:''}); break;
  case 'ab-del': c.abilities.splice(i,1); break;
  case 'dev-on': c.device.on=!c.device.on; break;
  case 'dev-pow': c.device.powerUsed=clamp(c.device.powerUsed-n,0,c.device.powerMax); break;
  case 'dev-anon': c.device.anonUsed=clamp(c.device.anonUsed-n,0,c.device.anonMax); break;
  case 'dev-mask': c.device.anonUsed=0; log('Маскировка присутствия'); break;
  case 'dev-exit': c.device.anonUsed=0; c.device.powerUsed=c.device.djinns.filter(j=>j.active).reduce((s,j)=>s+(+j.cost||0),0); log('Выход из системы: мощность и анонимность восстановлены'); break;
  case 'djinn-add': c.device.djinns.push({name:'',bonus:4,cost:2,dc:16,text:'',active:false}); break;
  case 'djinn-del': { const j=c.device.djinns[i]; if(j.active) c.device.powerUsed=Math.max(0,c.device.powerUsed-(+j.cost||0)); c.device.djinns.splice(i,1); break; }
  case 'djinn-recall': { const j=c.device.djinns[i]; j.active=false; c.device.powerUsed=Math.max(0,c.device.powerUsed-(+j.cost||0)); log(`Джин «${j.name||'без имени'}» отозван`); break; }
  case 'djinn-send': { const j=c.device.djinns[i], free=c.device.powerMax-c.device.powerUsed; if(free<+j.cost){toast('Не хватает мощности');sv=false;break} c.device.powerUsed+=+j.cost; j.active=true; const r=rnd(20); log(`Джин «${j.name||'без имени'}» отправлен: ${r+(+j.bonus)} (d20 ${r} ${sgn(+j.bonus)})`); break; }
  case 'rep-add': c.rep.push({name:'',value:0}); break;
  case 'rep-del': c.rep.splice(i,1); break;
  case 'rep': c.rep[i].value=clamp(c.rep[i].value+n,-10,10); break;
  case 'fame': c.fame=clamp(c.fame+n,0,10); break;
  case 'hope': c.hope=clamp(c.hope+n*5,0,100); break;
  case 'export': { const t=JSON.stringify(c); navigator.clipboard?.writeText(t).then(()=>toast('Лист скопирован'),()=>{const io=document.getElementById('io');io.style.display='block';io.value=t;io.select()}); sv=false; rer=false; break; }
  case 'import': { const io=document.getElementById('io'); if(io.style.display!=='block'||!io.value.trim()){io.style.display='block';io.focus();sv=false;rer=false;break}
    try{const o=normalize(JSON.parse(io.value));o.id=uid();o.updated=Date.now();chars[o.id]=o;cur=o.id;log('Лист импортирован')}catch(e){toast('Не похоже на лист агента');sv=false;rer=false} break; }
  case 'del-char': remove(c.id); return;
  case 'roll-open': openRoll(ds.k); sv=false; rer=false; break;
  case 'r-close': closeRoll(); sv=false; rer=false; break;
  case 'r-mod': R.mod=clamp(+R.mod+n,-20,20); renderSheet(); sv=false; rer=false; break;
  case 'r-pow': R.power=clamp(R.power+n,0,c.device.powerMax-c.device.powerUsed); renderSheet(); sv=false; rer=false; break;
  case 'r-attack': R.attack=!R.attack; if(R.attack&&R.skill!=='sho'&&R.skill!=='agi'&&R.skill!=='con') R.skill='sho'; renderSheet(); sv=false; rer=false; break;
  case 'r-roll': doRoll(); sv=false; rer=false; break;
  case 'r-boost': { const r=R.res; c.balance-=1; r.raw=r.raw.map(o=>({d:o.d,total:o.total+3})); r.total=r.raw.map(o=>o.total).join(' / '); r.parts.push(['Равновесие',3]); if(r.dc) r.win=r.raw[0].total>=r.dc; log(`+3 за равновесие → ${r.total}${r.dc?(r.win?', успех':', провал'):''}`); save(); renderSheet(); if(tab==='agent') render(); return; }
  case 'r-token': { const r=R.res; c.tokens-=1; r.auto=true; r.win=true; log(`Жетон профессионализма: ${SK[R.skill].n} — автоуспех`); save(); renderSheet(); if(tab==='agent') render(); return; }
  default: if(armyAct(a,ds,c,n,i)==='ui') sv=false;
 }
 if(sv) save(); if(rer) render();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled) return;act(b.dataset.act,b.dataset,b)});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.rbind){ R[t.dataset.rbind]=t.type==='number'?t.value:t.value; if(t.tagName==='SELECT'){ if(t.dataset.rbind==='light'||t.dataset.rbind==='cover'||t.dataset.rbind==='aim') R[t.dataset.rbind]=+t.value; R.res=null; renderSheet(); } return; }
 if(t.dataset.ubind){ let v=t.value; if('num' in t.dataset) v=+v||0; setPath(ui,t.dataset.ubind,v); if(t.tagName==='SELECT') render(); return; }
 if(!t.dataset.bind) return;
 let v=t.value; if('num' in t.dataset) v=+v||0;
 setPath(C(),t.dataset.bind,v);
 const hm=t.dataset.bind.match(/^army\.squads\.#(\w+)\.hpMax$/);
 if(hm){ const A=C().army, sq=A.squads.find(x=>x.id===hm[1]); if(sq&&(!A.battle.on||sq.hp>sq.hpMax)) sq.hp=Math.max(0,sq.hpMax); }
 save();
 if('rerenderName' in t.dataset){ const o=document.querySelector(`#charSel option[value="${cur}"]`); if(o) o.textContent=v||'Без имени'; }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='charSel'){ if(t.value==='__new'){const c=newChar();chars[c.id]=c;cur=c.id;tab='dossier';save()} else cur=t.value; lsSave(); closeRoll(); render(); return; }
 if(t.dataset.bind&&'rerender' in t.dataset) render();
});

/* ---------- boot ---------- */
lsLoad(); ensureChar(); render(); initDb();
</script>
</body>
